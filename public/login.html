<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ - ศูนย์รวมระบบบริหารจัดการหน้างาน</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/hub.css">
  <style>
    body {
      background: radial-gradient(circle at top right, #17326E 0%, #0B1F4B 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-box {
      background: #FFFFFF;
      width: 100%;
      max-width: 440px;
      border-radius: 18px;
      padding: 38px 32px;
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.3);
      position: relative;
    }
    .login-brand {
      text-align: center;
      margin-bottom: 28px;
    }
    .brand-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 12px;
      background: #0B1F4B;
      color: #fff;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 700;
      border: 2px solid var(--amber);
    }
    .login-brand h1 {
      font-size: 20px;
      font-weight: 700;
      color: #0B1F4B;
    }
    .login-brand p {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
    }
    .form-group {
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group label {
      font-size: 13px;
      font-weight: 500;
      color: var(--ink);
    }
    .form-group input {
      font-family: inherit;
      font-size: 14.5px;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--paper);
      color: var(--ink);
      transition: all 0.2s;
    }
    .form-group input:focus {
      outline: none;
      border-color: #0B1F4B;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(11, 31, 75, 0.1);
    }
    .btn-login {
      width: 100%;
      padding: 13px;
      background: #0B1F4B;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }
    .btn-login:hover {
      background: #17326E;
    }
    .demo-accounts {
      margin-top: 26px;
      padding-top: 20px;
      border-top: 1px dashed var(--line);
    }
    .demo-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
      text-align: center;
    }
    .quick-btn {
      width: 100%;
      padding: 8px 12px;
      margin-bottom: 8px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.15s;
    }
    .quick-btn:hover {
      background: #E8EEF8;
      border-color: #B5C7E8;
    }
    .quick-role {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }
    .back-home {
      display: block;
      text-align: center;
      margin-top: 18px;
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
    }
    .back-home:hover {
      color: var(--ink);
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <div class="login-brand">
      <div class="brand-icon">SP</div>
      <h1>เข้าสู่ระบบจัดการหน้างาน</h1>
      <p>Site Management Hub &bull; PostgreSQL Edition</p>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="username">ชื่อผู้ใช้งาน (Username)</label>
        <input type="text" id="username" required placeholder="เช่น admin หรือ staff" autofocus autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">รหัสผ่าน (Password)</label>
        <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
      </div>

      <button type="submit" class="btn-login" id="submitBtn">เข้าสู่ระบบ</button>
    </form>

    <div class="demo-accounts">
      <div class="demo-title">ปุ่มลัดสำหรับเข้าสู่ระบบทดสอบ</div>
      <button type="button" class="quick-btn" onclick="fillAndLogin('admin', 'admin1234')">
        <span>เข้าสู่ระบบเป็น <strong>Admin (ผู้ดูแลระบบ)</strong></span>
        <span class="quick-role" style="background:#FDECEC; color:#C62828;">ADMIN</span>
      </button>
      <button type="button" class="quick-btn" onclick="fillAndLogin('staff', 'staff1234')">
        <span>เข้าสู่ระบบเป็น <strong>Staff (เจ้าหน้าที่ไซต์)</strong></span>
        <span class="quick-role" style="background:#E3F5EC; color:#1E9E6A;">STAFF</span>
      </button>
    </div>

    <a href="/" class="back-home">← กลับสู่หน้าหลักระบบ</a>
  </div>

  <div id="hubToast"></div>

  <script src="/js/api-client.js"></script>
  <script>
    async function handleLogin(e) {
      if (e) e.preventDefault();
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value;
      const btn = document.getElementById('submitBtn');

      if (!u || !p) return;

      btn.textContent = 'กำลังตรวจสอบ...';
      btn.disabled = true;

      try {
        const res = await API.login(u, p);
        if (res.ok) {
          hubToast('เข้าสู่ระบบสำเร็จ! กำลังเปลี่ยนหน้า...');
          setTimeout(() => {
            if (res.user.role === 'admin') {
              window.location.href = '/admin';
            } else {
              window.location.href = '/';
            }
          }, 800);
        }
      } catch (err) {
        hubToast(err.message || 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
        btn.textContent = 'เข้าสู่ระบบ';
        btn.disabled = false;
      }
    }

    function fillAndLogin(user, pass) {
      document.getElementById('username').value = user;
      document.getElementById('password').value = pass;
      handleLogin();
    }
  </script>
</body>
</html>
