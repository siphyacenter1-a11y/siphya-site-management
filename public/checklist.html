<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <!-- วางบล็อกนี้ทั้งก้อน "ก่อนบรรทัด </head>" ใน ChecklistIndex.html -->
<style>
  :root:root:root {
    color-scheme: light;
    --bg: #F7F6F2; --surface: #FFFFFF; --surface-2: #F2F1EC;
    --ink: #0B1F4B; --ink-soft: #5A6478; --ink-faint: #8A93A5;
    --border: #E1E3E9; --border-strong: #C9CEDA;
    --accent: #0B1F4B; --accent-ink: #0B1F4B; --accent-bg: #E6EBF5;
    --ok: #1E8A5C; --ok-bg: #E3F5EC; --ok-border: #B5E3CB;
    --area: #A56F00; --area-bg: #FFF4D6; --area-border: #F0D48A;
    --room: #C62828; --room-bg: #FDECEC; --room-border: #F0B9B9;
    --focus: #2F5D9E; --catband: #E6EBF5; --catband-ink: #0B1F4B;
  }
  .hub-home { background: #0B1F4B; }
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เช็คลิสต์ตรวจควบคุมพื้นที่ประจำวัน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Sans+Myanmar:wght@400;500;600;700&family=Noto+Sans+Khmer:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/site-hub.css">
  <script src="/js/gas-shim.js"></script>
<style>
  :root{
    --bg:#EEF0EA; --surface:#FFFFFF; --surface-2:#F6F7F2;
    --ink:#1D2620; --ink-soft:#5B655C; --ink-faint:#8A9188;
    --border:#DADFD3; --border-strong:#C3CABA;
    --accent:#B8722A; --accent-ink:#7A4A18; --accent-bg:#F5E6D3;
    --ok:#2E7D52; --ok-bg:#E1F0E6; --ok-border:#B8DDC5;
    --area:#B8722A; --area-bg:#F6E7D4; --area-border:#E4C393;
    --room:#B0432F; --room-bg:#F7E0DA; --room-border:#E7B4A6;
    --focus:#2C5F8A; --catband:#DCE7EE; --catband-ink:#1F3A4D;
    --shadow: 0 1px 2px rgba(20,28,20,0.06), 0 4px 14px rgba(20,28,20,0.06);
    --radius-s: 6px; --radius-m: 10px; --radius-l: 16px;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --bg:#141713; --surface:#1C201A; --surface-2:#20241D;
      --ink:#EAEDE5; --ink-soft:#AEB6A8; --ink-faint:#7C8577;
      --border:#333A2E; --border-strong:#454E3D;
      --accent:#E0A566; --accent-ink:#F3D5AE; --accent-bg:#3A2C18;
      --ok:#6FC493; --ok-bg:#1D3227; --ok-border:#2E4E39;
      --area:#E0A566; --area-bg:#3A2C18; --area-border:#5A431F;
      --room:#E38A76; --room-bg:#3A211C; --room-border:#5C332A;
      --focus:#7FB3DE; --catband:#1F2E38; --catband-ink:#BFD8E8;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 14px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#141713; --surface:#1C201A; --surface-2:#20241D;
    --ink:#EAEDE5; --ink-soft:#AEB6A8; --ink-faint:#7C8577;
    --border:#333A2E; --border-strong:#454E3D;
    --accent:#E0A566; --accent-ink:#F3D5AE; --accent-bg:#3A2C18;
    --ok:#6FC493; --ok-bg:#1D3227; --ok-border:#2E4E39;
    --area:#E0A566; --area-bg:#3A2C18; --area-border:#5A431F;
    --room:#E38A76; --room-bg:#3A211C; --room-border:#5C332A;
    --focus:#7FB3DE; --catband:#1F2E38; --catband-ink:#BFD8E8;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 14px rgba(0,0,0,0.35);
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Noto Sans','Noto Sans Thai',sans-serif;
    -webkit-font-smoothing:antialiased; padding-bottom:96px;
  }
  body[lang="th"]{ font-family:'Noto Sans Thai','Noto Sans',sans-serif; }
  body[lang="my"]{ font-family:'Noto Sans Myanmar','Noto Sans',sans-serif; }
  body[lang="km"]{ font-family:'Noto Sans Khmer','Noto Sans',sans-serif; }
  a{ color:inherit; } button{ font-family:inherit; }
  .wrap{ max-width:880px; margin:0 auto; padding:0 16px; }
  .hidden{ display:none !important; }

  /* Header */
  header.topbar{ background:var(--surface); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:20; }
  .topbar-inner{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 16px; max-width:880px; margin:0 auto; }
  .brand{ display:flex; align-items:center; gap:10px; min-width:0; }
   .brand-mark{ width:38px; height:38px; border-radius:10px; background:var(--surface-2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:22px; line-height:1; flex:none; }
  .brand-text{ min-width:0; }
  .brand-title{ font-weight:700; font-size:15px; line-height:1.25; }
  .brand-sub{ font-size:12px; color:var(--ink-soft); line-height:1.3; }
  .langswitch{ display:flex; gap:4px; background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:3px; flex:none; }
  .langswitch button{ border:none; background:transparent; color:var(--ink-soft); font-size:13px; font-weight:600; padding:6px 12px; border-radius:999px; cursor:pointer; transition:background .15s ease, color .15s ease; }
  .langswitch button.active{ background:var(--accent); color:#fff; }
  .langswitch button:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }
  /* ปุ่มหน้าแรก (HomeFab) — อยู่เหนือแถบหัว แต่ต่ำกว่า popup ลงนาม/แก้ไข */
  .hub-home-fab{ z-index:45; }
  /* จอเล็กกว่า 1100px: เว้นที่ซ้ายของแถบหัวให้ปุ่ม ไม่ให้ทับชื่อระบบ */
  @media (max-width:1099px){ header.topbar .topbar-inner{ padding-left:120px; } }
  /* มือถือ: เหลือแค่ไอคอนบ้าน */
  @media (max-width:520px){
    .hub-home-fab span{ display:none; }
    header.topbar .topbar-inner{ padding-left:64px; }
  }

  /* Tabs */
  .tabbar{ background:var(--surface-2); border-bottom:1px solid var(--border); }
  .tabbar-inner{ max-width:880px; margin:0 auto; display:flex; gap:4px; padding:8px 16px; }
  .tab-btn{ flex:1; text-align:center; padding:9px 12px; border-radius:10px; border:1px solid transparent; background:transparent; color:var(--ink-soft); font-weight:700; font-size:13.5px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; }
  .tab-btn svg{ width:15px; height:15px; }
  .tab-btn.active{ background:var(--surface); border-color:var(--border); color:var(--accent-ink); box-shadow:var(--shadow); }
  .tab-btn:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }

  /* Meta card */
  .meta-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-l); box-shadow:var(--shadow); padding:16px; margin:16px 0; display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; }
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field label{ font-size:12.5px; font-weight:600; color:var(--ink-soft); }
  .field input, .field select{ border:1px solid var(--border-strong); border-radius:var(--radius-s); padding:10px 12px; font-size:14.5px; background:var(--surface); color:var(--ink); font-family:inherit; }
  .field select{ appearance:none; -webkit-appearance:none; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235B655C' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>"); background-repeat:no-repeat; background-position:right 10px center; background-size:16px; padding-right:34px; }
  .field input:focus-visible, .field select:focus-visible{ outline:2px solid var(--focus); outline-offset:1px; }
  .progress-row{ grid-column:1 / -1; display:flex; align-items:center; gap:12px; padding-top:4px; border-top:1px dashed var(--border); margin-top:2px; }
  .progress-track{ flex:1; height:8px; border-radius:99px; background:var(--surface-2); overflow:hidden; border:1px solid var(--border); }
  .progress-fill{ height:100%; background:linear-gradient(90deg, var(--accent), var(--ok)); width:0%; transition:width .25s ease; }
  .progress-text{ font-size:12.5px; color:var(--ink-soft); font-weight:600; white-space:nowrap; }

  .list-controls{ display:flex; justify-content:flex-end; gap:6px; margin-bottom:10px; }
  .ghost-btn{ display:inline-flex; align-items:center; gap:5px; border:1px solid var(--border); background:var(--surface-2); color:var(--ink-soft); font-size:11.5px; font-weight:600; padding:5px 11px 5px 9px; border-radius:999px; cursor:pointer; letter-spacing:.01em; transition:background .12s ease, color .12s ease, border-color .12s ease; }
  .ghost-btn svg{ width:12px; height:12px; flex:none; }
  .ghost-btn:hover{ background:var(--accent-bg); color:var(--accent-ink); border-color:var(--area-border); }
  .ghost-btn:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }

  /* Category accordion */
  .category{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-l); margin-bottom:10px; overflow:hidden; box-shadow:var(--shadow); }
  .cat-head{ width:100%; display:flex; align-items:center; gap:12px; background:var(--catband); color:var(--catband-ink); border:none; padding:14px 16px; cursor:pointer; text-align:left; font-family:inherit; }
  .cat-head:focus-visible{ outline:2px solid var(--focus); outline-offset:-2px; }
  .cat-num{ flex:none; width:26px; height:26px; border-radius:8px; background:rgba(255,255,255,0.55); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; }
  .cat-title{ flex:1; font-weight:700; font-size:14.5px; line-height:1.35; }
  .cat-badge{ flex:none; font-size:12px; font-weight:700; padding:3px 9px; border-radius:999px; background:rgba(255,255,255,0.6); color:var(--catband-ink); }
  .cat-badge.done{ background:var(--ok); color:#fff; }
  .cat-chevron{ flex:none; width:18px; height:18px; opacity:.75; transition:transform .2s ease; }
  .category.open .cat-chevron{ transform:rotate(180deg); }
  .cat-body{ display:none; }
  .category.open .cat-body{ display:block; }
  .item{ padding:14px 16px; border-top:1px solid var(--border); }
  .item-head{ display:flex; gap:10px; margin-bottom:10px; }
  .item-no{ flex:none; font-weight:700; font-size:12.5px; color:var(--accent-ink); background:var(--accent-bg); border-radius:7px; padding:3px 7px; height:fit-content; margin-top:1px; }
  .item-text{ font-size:16.5px; font-weight:500; line-height:1.6; color:var(--ink); }
  .status-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
  .status-btn{ display:flex; align-items:center; gap:7px; border-radius:999px; cursor:pointer; padding:8px 14px; font-size:13px; font-weight:600; border:1.5px solid var(--border-strong); background:var(--surface); color:var(--ink-soft); transition:all .12s ease; }
  .status-btn svg{ width:16px; height:16px; flex:none; }
  .status-btn:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }
  .status-btn[data-kind="ok"].active{ background:var(--ok-bg); border-color:var(--ok-border); color:var(--ok); }
  .status-btn[data-kind="area"].active{ background:var(--area-bg); border-color:var(--area-border); color:var(--area); }
  .status-btn[data-kind="room"].active{ background:var(--room-bg); border-color:var(--room-border); color:var(--room); }
  .status-btn[data-kind="na"]{ font-size:12px; padding:6px 11px; border-style:dashed; color:var(--ink-faint); }
  .status-btn[data-kind="na"].active{ background:var(--surface-2); border-style:solid; border-color:var(--ink-faint); color:var(--ink-soft); }
  .location-row{ margin-bottom:8px; }
  .location-row input{ width:100%; border:1.5px solid var(--area-border); border-radius:var(--radius-s); padding:9px 11px; font-size:13.5px; background:var(--area-bg); color:var(--ink); font-family:inherit; }
  .location-row input:focus-visible{ outline:2px solid var(--focus); outline-offset:1px; }
  .location-row.kind-room input{ border-color:var(--room-border); background:var(--room-bg); }
  .detail-row{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  @media (max-width:520px){ .detail-row{ grid-template-columns:1fr; } }
  .detail-row input{ border:1px solid var(--border); border-radius:var(--radius-s); padding:8px 10px; font-size:13.5px; background:var(--surface-2); color:var(--ink); font-family:inherit; }
  .detail-row input:focus-visible{ outline:2px solid var(--focus); outline-offset:1px; }

  /* Photo attachments */
  .photo-row{ margin-top:10px; }
  .photo-label{ font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:6px; display:block; }
  .photo-add-btn{ display:inline-flex; align-items:center; gap:6px; border:1.5px dashed var(--border-strong); background:var(--surface-2); color:var(--ink-soft); font-size:12.5px; font-weight:600; padding:8px 12px; border-radius:var(--radius-s); cursor:pointer; }
  .photo-add-btn svg{ width:15px; height:15px; }
  .photo-add-btn:hover{ background:var(--accent-bg); color:var(--accent-ink); border-color:var(--area-border); }
  .photo-thumbs{ display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .photo-thumb{ position:relative; width:64px; height:64px; border-radius:8px; overflow:hidden; border:1px solid var(--border); flex:none; }
  .photo-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .photo-thumb-remove{ position:absolute; top:2px; right:2px; width:18px; height:18px; border-radius:50%; background:rgba(0,0,0,0.6); color:#fff; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:12px; line-height:1; padding:0; }
  .photo-thumb-remove svg{ width:10px; height:10px; }
  .photo-uploading{ font-size:11.5px; color:var(--ink-faint); margin-top:4px; }

  /* Signatures */
  .sign-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-l); box-shadow:var(--shadow); padding:16px; margin:16px 0; }
  .sign-card h3{ margin:0 0 12px; font-size:14px; }
  .sign-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  @media (max-width:640px){ .sign-grid{ grid-template-columns:1fr; } }
  .sign-item{ text-align:center; }
  .sign-line{ border-bottom:1.5px dotted var(--border-strong); height:34px; display:flex; align-items:flex-end; justify-content:center; padding-bottom:4px; }
  .sign-item input{ border:none; background:transparent; text-align:center; font-size:13.5px; color:var(--ink); width:100%; font-family:inherit; }
  .sign-item input:focus-visible{ outline:2px solid var(--focus); border-radius:4px; }
  .sign-role{ margin-top:6px; font-size:12.5px; color:var(--ink-soft); font-weight:600; }
  .footnote{ font-size:12px; color:var(--ink-faint); text-align:center; margin:6px 0 24px; padding:0 8px; }

  /* Dashboard */
  .dash-header{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin:16px 0 4px; flex-wrap:wrap; }
  .dash-header h2{ font-size:16px; margin:0; }
  .dash-filters{ display:flex; gap:8px; flex-wrap:wrap; }
  .dash-filter-select{ border:1px solid var(--border-strong); border-radius:var(--radius-s); padding:8px 30px 8px 12px; font-size:13.5px; background:var(--surface); color:var(--ink); font-family:inherit; appearance:none; -webkit-appearance:none; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235B655C' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>"); background-repeat:no-repeat; background-position:right 8px center; background-size:14px; max-width:100%; }
  .dash-filter-select:focus-visible{ outline:2px solid var(--focus); outline-offset:1px; }
  input.dash-filter-select{ background-image:none; padding:8px 12px; }
  .dash-chart-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-l); box-shadow:var(--shadow); padding:16px; margin:0 0 18px; }
  .dash-chart-title{ font-weight:700; font-size:14px; margin-bottom:12px; }
  .dash-chart-row{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .dash-chart-row:last-child{ margin-bottom:0; }
  .dash-chart-label{ flex:0 0 34%; font-size:12.5px; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dash-chart-count{ color:var(--ink-faint); font-size:11px; margin-left:4px; }
  .dash-chart-track{ flex:1; height:10px; border-radius:99px; background:var(--surface-2); border:1px solid var(--border); overflow:hidden; min-width:40px; }
  .dash-chart-fill{ height:100%; border-radius:99px; transition:width .25s ease; }
  .dash-chart-pct{ flex:0 0 42px; text-align:right; font-weight:700; font-size:12.5px; color:var(--ink-soft); }
  .dash-table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  .dash-table th, .dash-table td{ padding:7px 8px; border-bottom:1px solid var(--border); text-align:left; }
  .dash-table th{ color:var(--ink-soft); font-weight:700; font-size:11.5px; }
  .dash-table td{ color:var(--ink); }
  .dash-table tr:last-child td{ border-bottom:none; }
  .dash-table-num{ text-align:center; white-space:nowrap; width:1%; }
  .dash-stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin:12px 0 18px; }
  .dash-stat{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m); padding:14px; text-align:center; box-shadow:var(--shadow); }
  .dash-stat-value{ font-size:22px; font-weight:700; color:var(--accent-ink); }
  .dash-stat-label{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .dash-list{ display:flex; flex-direction:column; gap:10px; margin:0 0 32px; }
  .dash-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m); padding:14px; box-shadow:var(--shadow); }
  .dash-card-top{ display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:6px; }
  .dash-card-site{ font-weight:700; font-size:14.5px; }
  .dash-card-meta{ font-size:12px; color:var(--ink-soft); line-height:1.5; }
  .dash-card-row{ display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-top:8px; }
  .dash-pill{ font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px; background:var(--surface-2); border:1px solid var(--border); color:var(--ink-soft); white-space:nowrap; }
  .dash-pill.complete{ background:var(--ok-bg); border-color:var(--ok-border); color:var(--ok); }
  .dash-empty, .dash-loading, .dash-noaccess{ text-align:center; color:var(--ink-soft); padding:44px 16px; font-size:13.5px; }
  .dash-view-btn{ border:1.5px solid var(--border-strong); background:var(--surface); color:var(--accent-ink); font-size:12.5px; font-weight:700; padding:7px 13px; border-radius:999px; cursor:pointer; }
  .dash-view-btn:hover{ background:var(--surface-2); }
    /* Sign-off (dashboard) */
  .sign-item input:disabled{ color:var(--ink-faint); cursor:not-allowed; }
  .dash-sign-status{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .dash-sign-pill{ font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px; border:1px solid var(--area-border); background:var(--area-bg); color:var(--area); }
  .dash-sign-pill.signed{ border-color:var(--ok-border); background:var(--ok-bg); color:var(--ok); }
  .dash-card-actions{ display:flex; gap:6px; flex-wrap:wrap; }
  .dash-sign-btn{ border:1.5px solid var(--accent); background:var(--accent); color:#fff; font-size:12.5px; font-weight:700; padding:7px 13px; border-radius:999px; cursor:pointer; }
  .dash-sign-btn:hover{ filter:brightness(1.05); }
  .modal-backdrop{ position:fixed; inset:0; background:rgba(15,20,15,.45); z-index:50; display:flex; align-items:center; justify-content:center; padding:16px; }
  .modal{ background:var(--surface); border-radius:var(--radius-l); box-shadow:0 10px 40px rgba(0,0,0,.25); width:100%; max-width:440px; max-height:90vh; overflow:auto; padding:18px; }
  .modal h3{ margin:0 0 4px; font-size:15px; }
  .modal-sub{ font-size:12.5px; color:var(--ink-soft); margin-bottom:12px; line-height:1.5; }
  .modal-issues{ background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-s); padding:10px 12px; font-size:12.5px; margin-bottom:12px; line-height:1.6; }
  .modal .field{ margin-bottom:10px; }
  .modal-actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:6px; }
  .modal-error{ color:var(--room); font-size:12.5px; font-weight:600; min-height:18px; margin-bottom:6px; }

  /* Bottom bar */
  .bottombar{ position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--surface); border-top:1px solid var(--border); padding:10px 16px calc(10px + env(safe-area-inset-bottom)); }
  .bottombar-inner{ max-width:880px; margin:0 auto; display:flex; align-items:center; gap:10px; }
  .autosave{ font-size:11.5px; color:var(--ink-faint); flex:1; min-width:0; }
  .btn{ border-radius:999px; padding:11px 16px; font-size:13.5px; font-weight:700; cursor:pointer; border:1.5px solid transparent; display:flex; align-items:center; gap:7px; white-space:nowrap; }
  .btn:disabled{ opacity:.55; cursor:not-allowed; }
  .btn:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }
  .btn-outline{ background:var(--surface); border-color:var(--border-strong); color:var(--ink-soft); }
  .btn-outline:hover{ background:var(--surface-2); }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-primary:hover{ filter:brightness(1.05); }
  .btn-full{ flex:1; justify-content:center; }
  .btn svg{ width:16px; height:16px; }

  .warn-banner{ display:flex; align-items:center; gap:8px; background:var(--area-bg); color:var(--area); border:1px solid var(--area-border); border-radius:var(--radius-m); padding:9px 12px; font-size:12.5px; font-weight:600; margin:0 0 12px; }
  .warn-banner svg{ flex:none; width:16px; height:16px; }
  .warn-banner.ok{ background:var(--ok-bg); border-color:var(--ok-border); color:var(--ok); }
  .toast{ position:fixed; left:50%; bottom:84px; transform:translateX(-50%); background:var(--ink); color:var(--bg); font-size:13px; font-weight:600; padding:10px 18px; border-radius:999px; box-shadow:var(--shadow); z-index:40; opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-4px); }
  /* ช่องที่ยังไม่กรอก */
  .is-missing{ border-color:var(--room) !important; background:var(--room-bg) !important; }
  .item.item-missing{ box-shadow:inset 4px 0 0 var(--room); background:var(--room-bg); }
  .missing-note{ font-size:12.5px; font-weight:700; color:var(--room); margin:-4px 0 8px; }
  .category.cat-missing .cat-badge{ background:var(--room); color:#fff; }
  .sign-line.is-missing{ border-bottom:2px solid var(--room); border-radius:4px; }
  .missing-box{ background:var(--room-bg); border:1.5px solid var(--room-border); color:var(--room); border-radius:var(--radius-m); padding:12px 14px; margin:16px 0; font-size:13px; font-weight:600; }
  .missing-box-title{ margin-bottom:8px; }
  .missing-chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .missing-chip{ border:1px solid var(--room-border); background:var(--surface); color:var(--room); font-size:12px; font-weight:700; padding:5px 10px; border-radius:999px; cursor:pointer; font-family:inherit; }
  #printSheet{ display:none; }
  /* หน้าตัวอย่างก่อนสร้าง PDF */
  .pv-backdrop{ position:fixed; inset:0; z-index:60; background:rgba(15,20,15,.55); display:flex; flex-direction:column; }
  .pv-bar{ display:flex; gap:8px; align-items:center; padding:10px 12px; background:var(--surface); border-bottom:1px solid var(--border); }
  .pv-bar .btn{ padding:9px 14px; }
  .pv-bar-title{ flex:1; font-weight:700; font-size:13.5px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pv-scroll{ flex:1; overflow:auto; -webkit-overflow-scrolling:touch; padding:16px 8px 40px; }
  .pv-paper{ background:#fff; color:#000; width:794px; margin:0 auto; padding:28px 32px; box-shadow:0 4px 20px rgba(0,0,0,.25); font-family:'Noto Sans Thai','Noto Sans',sans-serif; }
  .pv-paper .p-logo{ display:block; margin:0 auto 8px; max-height:64px; max-width:220px; }
  .pv-paper .p-title{ text-align:center; font-size:17px; font-weight:700; margin-bottom:6px; }
  .pv-paper .p-meta{ width:100%; font-size:12px; margin-bottom:10px; border-collapse:collapse; }
  .pv-paper .p-meta td{ padding:0; }
  .pv-paper .p-table{ width:100%; border-collapse:collapse; font-size:11px; }
  .pv-paper .p-table th, .pv-paper .p-table td{ border:1px solid #444; padding:5px 6px; vertical-align:top; }
  .pv-paper .p-table th{ background:#eee; font-weight:700; }
  .pv-paper .p-cat-row td{ background:#DCE9F5; font-weight:700; }
  .pv-paper .p-num{ width:28px; text-align:center; }
  .pv-paper .p-check{ width:56px; text-align:center; font-weight:700; }
  .pv-paper .p-name{ width:90px; }
  .pv-paper .p-remark{ width:100px; }
  .pv-paper .p-photos{ padding:4px 0; }
  .pv-paper .p-photos img{ width:48%; height:auto; max-height:320px; object-fit:contain; margin:3px 1%; border:1px solid #999; border-radius:3px; vertical-align:top; }
  .pv-paper .p-sign{ width:100%; margin-top:22px; border-collapse:collapse; }
  .pv-paper .p-sign td{ width:33%; text-align:center; font-size:11px; padding:0 10px; vertical-align:top; }
  .pv-paper .p-sign-line{ border-bottom:1px solid #444; height:26px; margin-bottom:4px; }
  .pv-paper .p-footnote{ font-size:10px; margin-top:10px; }
  .toast{ z-index:70; }
  @media print{
    /* เอาทั้งแอปออกจากผังเอกสารจริงๆ (display:none) แทนแค่ซ่อน (visibility:hidden)
       เพราะ visibility:hidden ยังกินพื้นที่อยู่ ทำให้เกิดหน้าเปล่าเกินมาตอนพิมพ์ */
    body > *:not(#printSheet):not(.toast){ display:none !important; }
    header.topbar, .tabbar, .bottombar, .meta-card .progress-row, .list-controls, .toast{ display:none !important; }
    #printSheet{ display:block !important; visibility:visible; position:static; left:auto; top:auto; width:100%; }
    body{ padding-bottom:0 !important; }
    @page{ size:A4 portrait; margin:12mm; }
    .p-title{ text-align:center; font-size:16px; font-weight:700; margin-bottom:4px; }

    .p-table{ width:100%; border-collapse:collapse; font-size:10px; }
    .p-table th, .p-table td{ border:1px solid #444; padding:5px 6px; vertical-align:top; }
    .p-table th{ background:#eee; font-weight:700; }
    .p-cat-row td{ background:#DCE9F5; font-weight:700; font-size:10.5px; }
    .p-num{ width:26px; text-align:center; }
    .p-check{ width:56px; text-align:center; font-weight:700; }
    .p-name{ width:90px; }
    .p-remark{ width:90px; }
    .p-photo-row td{ border-top:none; padding-top:0; }
    .p-sign-line{ border-bottom:1px solid #444; height:26px; margin-bottom:4px; }
    .p-footnote{ font-size:9.5px; margin-top:10px; }
    .p-meta{ width:100%; font-size:11.5px; margin-bottom:10px; border-collapse:collapse; }
    .p-meta td{ padding:0; }
    .p-photos{ padding:4px 0; }
    .p-photos img{ width:48%; height:auto; max-height:320px; object-fit:contain; margin:3px 1%; border:1px solid #999; border-radius:3px; vertical-align:top; }
    .p-sign{ width:100%; margin-top:22px; page-break-inside:avoid; border-collapse:collapse; }
    .p-sign td{ width:33%; text-align:center; font-size:10.5px; padding:0 10px; vertical-align:top; }
    tr{ page-break-inside:avoid; }
  }
</style>

  /* ---------------- State ---------------- */
  var STORAGE_KEY = 'siphraya_checklist_draft_v2';
  var state = {
    lang:'th', tab:'form', site:'', date:'', recordedBy:'',
    items:{}, signers:['', '', ''], openCats:{},
    submissions:[], dbAvailable:null, dbErrorCode:null, submitting:false, dashSiteFilter:'',
    dashDateFilter:'all', dashDateFrom:'', dashDateTo:''
  };
  ALL_ITEM_IDS.forEach(function(id){ state.items[id] = { status:null, worker:'', remark:'', location:'', photos:[] }; });
  STRUCTURE.forEach(function(c, idx){ state.openCats[c.cat] = idx === 0; });

  function loadDraft(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return;
      var saved = JSON.parse(raw);
      if(saved && typeof saved === 'object'){
        state.lang = saved.lang || state.lang;
        state.site = saved.site || '';
        state.date = saved.date || '';
        state.recordedBy = saved.recordedBy || '';
        state.signers = saved.signers && saved.signers.length === 3 ? saved.signers : state.signers;
        if(saved.items){
          ALL_ITEM_IDS.forEach(function(id){
            if(saved.items[id]){
              state.items[id] = saved.items[id];
              if(!state.items[id].photos) state.items[id].photos = [];
            }
          });
        }
      }
    }catch(e){}
  }
  var saveTimer = null;
     // เก็บเฉพาะข้อมูลฟอร์ม (ไม่เอา submissions ของแดชบอร์ดลง localStorage)
  function draftSnapshot_(){
    return {
      lang: state.lang, site: state.site, date: state.date,
      recordedBy: state.recordedBy, signers: state.signers, items: state.items
    };
  }
  function saveDraft(){
    if(editCtx) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      try{
        localStorage.setItem(STORAGE_KEY, JSON.stringify(draftSnapshot_()));
      }catch(e){
        try{
          var lite = JSON.parse(JSON.stringify(draftSnapshot_()));
          ALL_ITEM_IDS.forEach(function(id){ lite.items[id].photos = []; });
          localStorage.setItem(STORAGE_KEY, JSON.stringify(lite));
        }catch(e2){}
      }
    }, 200);
  }

  // ล้างฟอร์มหลังบันทึกสำเร็จ: คงภาษาและโครงการไว้ ที่เหลือเริ่มใหม่
  function clearFormAfterSubmit(){
    var now = new Date();
    state.date = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
    state.recordedBy = '';
    state.signers = ['', '', ''];
    ALL_ITEM_IDS.forEach(function(id){ state.items[id] = { status:null, worker:'', remark:'', location:'', photos:[] }; });
    STRUCTURE.forEach(function(c, idx){ state.openCats[c.cat] = idx === 0; });
    showMissing = false;
    clearTimeout(saveTimer);
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(draftSnapshot_())); }catch(e){}
    renderAll();
    applyMissingMarks();
    window.scrollTo(0, 0);
  }

  function t(key, lang){ lang = lang || state.lang; return T[lang][key] !== undefined ? T[lang][key] : (T.th[key] || ''); }

  function completedCount(items){
    items = items || state.items;
    var n = 0;
    ALL_ITEM_IDS.forEach(function(id){ if(items[id] && items[id].status) n++; });
    return n;
  }

  function showToast(msg, ms){
    els.toast.textContent = msg;
    els.toast.style.width = 'max-content';
    els.toast.style.maxWidth = '90vw';
    els.toast.style.textAlign = 'center';
    els.toast.style.borderRadius = '16px';
    els.toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){ els.toast.classList.remove('show'); }, ms || 2600);
  }
  function renderStaticText(){
    els.body.setAttribute('lang', state.lang);
    document.documentElement.setAttribute('lang', state.lang);
    document.title = t('appTitle');
    document.querySelectorAll('[data-i18n]').forEach(function(el){ el.textContent = t(el.getAttribute('data-i18n')); });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el){ el.setAttribute('placeholder', t(el.getAttribute('data-i18n-placeholder'))); });
    els.langBtns.forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-lang') === state.lang); });
    els.autosaveText.textContent = t('autosaveOn');
    els.footnoteText.textContent = t('footnote');
  }

  function renderTabUI(){
    els.tabBtns.forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-tab') === state.tab); });
    els.formView.classList.toggle('hidden', state.tab !== 'form');
    els.dashboardView.classList.toggle('hidden', state.tab !== 'dashboard');
    els.bottombarForm.classList.toggle('hidden', state.tab !== 'form');
    els.bottombarDashboard.classList.toggle('hidden', state.tab !== 'dashboard');
  }

  function renderProgress(){
    var n = completedCount(), total = ALL_ITEM_IDS.length;
    els.progressFill.style.width = (total ? (n/total*100) : 0) + '%';
    els.progressText.textContent = t('progress')(n, total);
    var missing = total - n;
    if(missing > 0){
      els.warnBanner.innerHTML = '<div class="warn-banner">' + ICONS.warn + '<span>' + t('warnIncomplete')(missing) + '</span></div>';
    } else {
      els.warnBanner.innerHTML = '<div class="warn-banner ok">' + ICONS.check + '<span>' + t('warnComplete') + '</span></div>';
    }
  }

  function categoryDone(catItems){ return catItems.every(function(id){ return !!state.items[id].status; }); }

  function renderCategories(){
    var html = '';
    STRUCTURE.forEach(function(cat, idx){
      var open = !!state.openCats[cat.cat];
      var done = categoryDone(cat.items);
      html += '<div class="category' + (open ? ' open' : '') + '" data-cat="' + cat.cat + '">';
      html += '  <button type="button" class="cat-head" data-toggle="' + cat.cat + '" aria-expanded="' + open + '">';
      html += '    <span class="cat-num">' + (idx+1) + '</span>';
      html += '    <span class="cat-title">' + t(cat.cat) + '</span>';
      html += '    <span class="cat-badge' + (done ? ' done' : '') + '">' + cat.items.filter(function(id){return !!state.items[id].status;}).length + '/' + cat.items.length + '</span>';
      html += '    ' + ICONS.chevron;
      html += '  </button>';
      html += '  <div class="cat-body">';
      cat.items.forEach(function(id){
        var it = state.items[id];
        html += '    <div class="item" data-item="' + id + '">';
        html += '      <div class="item-head"><span class="item-no">' + id + '</span><span class="item-text">' + t(id) + '</span></div>';

        html += '        <button type="button" class="status-btn" data-kind="area" data-status="area" data-item="' + id + '"' + (it.status==='area'?' aria-pressed="true"':' aria-pressed="false"') + '>' + ICONS.area + '<span>' + t('colArea') + '</span></button>';
        html += '        <button type="button" class="status-btn" data-kind="room" data-status="room" data-item="' + id + '"' + (it.status==='room'?' aria-pressed="true"':' aria-pressed="false"') + '>' + ICONS.room + '<span>' + t('colRoom') + '</span></button>';
        html += '        <button type="button" class="status-btn" data-kind="na" data-status="na" data-item="' + id + '"' + (it.status==='na'?' aria-pressed="true"':' aria-pressed="false"') + '>' + ICONS.na + '<span>' + t('colNa') + '</span></button>';
        html += '      </div>';

  /* อ่านไฟล์รูปที่ผู้ใช้เลือก ย่อขนาดลง (ไม่เกิน 1280px และคุณภาพ JPEG 70%)
     ก่อนแปลงเป็น base64 dataURL เพื่อไม่ให้ข้อมูลที่ส่งไปบันทึกใหญ่เกินไป */
  function readAndCompressImage(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onerror = function(){ reject(new Error('read error')); };
      reader.onload = function(){
        var img = new Image();
        img.onerror = function(){ reject(new Error('image error')); };
        img.onload = function(){
          var maxDim = 1280;
          var w = img.width, h = img.height;
          if(w > maxDim || h > maxDim){
            if(w >= h){ h = Math.round(h * (maxDim / w)); w = maxDim; }
            else { w = Math.round(w * (maxDim / h)); h = maxDim; }
          }
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          var dataUrl = canvas.toDataURL('image/jpeg', 0.7);
          resolve({ data: dataUrl, mimeType: 'image/jpeg', name: file.name || 'photo.jpg' });
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  // แปลงลิงก์ Drive แบบเก่า (uc?id=...) เป็นลิงก์ thumbnail ที่แสดงเป็นรูปได้
  // ใช้ได้กับรายการเก่าที่บันทึกไว้แล้วด้วย ไม่ต้องแก้ข้อมูลในชีต
  function driveImgSrc(src){
    if(!src || String(src).indexOf('data:') === 0) return src;
    var m = String(src).match(/[?&]id=([a-zA-Z0-9_-]+)/) || String(src).match(/\/d\/([a-zA-Z0-9_-]+)/);
    return m ? ('https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w1000') : src;
  }

  // รอให้รูปในใบพิมพ์โหลดเสร็จก่อนเปิดหน้าต่างพิมพ์ (รอสูงสุด 10 วินาที)
  function printWhenImagesReady(){
    var imgs = Array.prototype.slice.call(els.printSheet.querySelectorAll('img'));
    var pending = imgs.filter(function(img){ return !img.complete; });
    if(!pending.length){ window.print(); return; }
    showToast('กำลังโหลดรูปก่อนพิมพ์...');
    var left = pending.length, fired = false;
    function go(){ if(fired) return; fired = true; window.print(); }
    pending.forEach(function(img){
      img.addEventListener('load', function(){ if(--left === 0) go(); });
      img.addEventListener('error', function(){ if(--left === 0) go(); });
    });
    setTimeout(go, 10000);
  }
  function formatDate(iso){
    if(!iso) return '.'.repeat(20);
    var parts = iso.split('-');
    if(parts.length !== 3) return iso;
    return parts[2] + '/' + parts[1] + '/' + parts[0];
  }
  function formatDateTime(iso){
    if(!iso) return '-';
    try{
      var d = new Date(iso);
      var dd = String(d.getDate()).padStart(2,'0');
      var mm = String(d.getMonth()+1).padStart(2,'0');
      var yyyy = d.getFullYear();
      var hh = String(d.getHours()).padStart(2,'0');
      var mi = String(d.getMinutes()).padStart(2,'0');
      return dd + '/' + mm + '/' + yyyy + ' ' + hh + ':' + mi;
    }catch(e){ return iso; }
  }

  function dateInFilterRange(dateStr, filter, fromStr, toStr){
    if(filter === 'all') return true;
    if(!dateStr) return false;
    var d = new Date(dateStr + 'T00:00:00');
    if(isNaN(d.getTime())) return false;
    var now = new Date();
    now.setHours(0,0,0,0);
    if(filter === 'today'){
      return dateStr === now.toISOString().slice(0,10);
    }
    if(filter === '7d'){
      var sevenAgo = new Date(now); sevenAgo.setDate(sevenAgo.getDate() - 6);
      return d >= sevenAgo && d <= now;
    }
    if(filter === 'month'){
      return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
    }
    if(filter === 'custom'){
      if(fromStr && d < new Date(fromStr + 'T00:00:00')) return false;
      if(toStr && d > new Date(toStr + 'T00:00:00')) return false;
      return true;
    }
    return true;
  }

  function buildProjectStats(subsForChart){
    var map = {};
    subsForChart.forEach(function(s){
      var site = s.site || t('noSite');
      if(!map[site]) map[site] = { count:0, sumCompleted:0 };
      map[site].count++;
      map[site].sumCompleted += completedCount(s.items || {});
    });
    var arr = Object.keys(map).map(function(site){
      var m = map[site];
      var avgPct = ALL_ITEM_IDS.length ? Math.round((m.sumCompleted / (m.count * ALL_ITEM_IDS.length)) * 100) : 0;
      return { site: site, count: m.count, avgPct: avgPct };
    });
    arr.sort(function(a, b){ return a.avgPct - b.avgPct; });
    return arr;
  }

  function exportDashboardCSV(){
    var subsArr = getFilteredSubs();

      t('siteLabel'), t('dateLabel'), t('colRecordedBy'), t('colSubmittedAt'),
      t('colCompletion'), t('dashNotOkSummary'), t('sign1'), t('sign2'), t('sign3')
    ];
    var rows = [header];
    subsArr.forEach(function(s){
      var n = completedCount(s.items || {});
      rows.push([
        s.site || t('noSite'),
        formatDate(s.date),
        s.recordedBy || t('noRecorder'),
        formatDateTime(s.submittedAt),
        n + '/' + ALL_ITEM_IDS.length,
        buildNotOkSummary(s.items || {}),
        (s.signers && s.signers[0]) || '',
        (s.signers && s.signers[1]) || '',
        (s.signers && s.signers[2]) || ''
      ]);
    });
    var csvContent = '\uFEFF' + rows.map(function(r){ return r.map(csvEscape).join(','); }).join('\r\n');
    var blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'checklist_export_' + new Date().toISOString().slice(0,10) + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  var showMissing = false; // เริ่มแสดงสีแดงหลังกดบันทึกครั้งแรกที่ยังไม่ครบ

  // รายการจุดที่ยังไม่กรอก เรียงจากบนลงล่างตามหน้าฟอร์ม
  function getMissing(){
    var list = [];
    if(!state.site) list.push({ key:'site', label:t('siteLabel') });
    if(!state.date) list.push({ key:'date', label:t('dateLabel') });
    if(!String(state.recordedBy || '').trim()) list.push({ key:'recordedBy', label:t('recordedByLabel') });
    ALL_ITEM_IDS.forEach(function(id){
      var it = state.items[id], parts = [];
      if(!it.status) parts.push('ผลตรวจ');
      var notOk = it.status === 'area' || it.status === 'room';
      if(notOk && !String(it.worker || '').trim()) parts.push('ชื่อผู้ปฏิบัติงาน');
      if(notOk && !String(it.location || '').trim()){
        parts.push(it.status === 'room' ? 'ระบุห้อง' : 'ระบุบริเวณ');
      }
      if(parts.length) list.push({ key:'item', id:id, label:'ข้อ ' + id, parts:parts });
    });
    if(!String(state.signers[0] || '').trim()) list.push({ key:'sign1', label:t('sign1') });
    return list;
  }

  function focusItem(id){
    STRUCTURE.forEach(function(c){ if(c.items.indexOf(id) > -1) state.openCats[c.cat] = true; });
    renderCategories();
    applyMissingMarks();
    var el = els.categories.querySelector('.item[data-item="' + id + '"]');
    if(el){
      el.scrollIntoView({ behavior:'smooth', block:'center' });
      var inp = el.querySelector('input.is-missing');
      if(inp) inp.focus({ preventScroll:true });
    }
  }

  function goToMissing(m){
    if(m.key === 'item'){ focusItem(m.id); return; }
    var el = m.key === 'site' ? els.siteInput
           : m.key === 'date' ? els.dateInput
           : m.key === 'recordedBy' ? els.recordedByInput
           : els.signGrid.querySelector('[data-signer="0"]');
    if(el){ el.scrollIntoView({ behavior:'smooth', block:'center' }); el.focus({ preventScroll:true }); }
  }

  // ทาสีแดงช่องที่ยังขาด + ข้อความในแต่ละข้อ + กล่องสรุปเหนือช่องลงนาม
  function applyMissingMarks(){
    var list = showMissing ? getMissing() : [];
    if(showMissing && !list.length) showMissing = false;
    var keys = {};
    list.forEach(function(m){ keys[m.key === 'item' ? m.id : m.key] = m; });
    function mark(el, on){ if(el) el.classList.toggle('is-missing', !!on); }

    mark(els.siteInput, keys.site);
    mark(els.dateInput, keys.date);
    mark(els.recordedByInput, keys.recordedBy);
    mark(els.signGrid.querySelector('.sign-line'), keys.sign1);

    STRUCTURE.forEach(function(c){
      var any = false;
      c.items.forEach(function(id){
        var itemEl = els.categories.querySelector('.item[data-item="' + id + '"]');
        if(!itemEl) return;
        var m = keys[id], it = state.items[id];
        if(m) any = true;
        itemEl.classList.toggle('item-missing', !!m);
        mark(itemEl.querySelector('.status-row'), m && !it.status);
        mark(itemEl.querySelector('[data-field="worker"]'), m && (it.status === 'area' || it.status === 'room') && !String(it.worker || '').trim());
        mark(itemEl.querySelector('[data-field="location"]'), m && !String(it.location || '').trim());
        var note = itemEl.querySelector('.missing-note');
        if(m){
          if(!note){
            note = document.createElement('div');
            note.className = 'missing-note';
            itemEl.querySelector('.item-head').insertAdjacentElement('afterend', note);
          }
          note.textContent = '⚠️ ยังไม่ได้กรอก: ' + m.parts.join(' / ');
        } else if(note){ note.remove(); }
      });
      var catEl = els.categories.querySelector('.category[data-cat="' + c.cat + '"]');
      if(catEl) catEl.classList.toggle('cat-missing', any);
    });

    var box = document.getElementById('missingBox');
    if(!box) return;
    if(!list.length){ box.innerHTML = ''; return; }
    box.innerHTML = '<div class="missing-box"><div class="missing-box-title">⚠️ ยังกรอกไม่ครบ ' + list.length +
      ' จุด กดที่ปุ่มเพื่อไปยังจุดนั้น</div><div class="missing-chips">' +
      list.map(function(m, i){
        return '<button type="button" class="missing-chip" data-missing-idx="' + i + '">' + escHtml(m.label) + '</button>';
      }).join('') + '</div></div>';
    box.querySelectorAll('[data-missing-idx]').forEach(function(b){
      b.onclick = function(){ goToMissing(list[Number(b.getAttribute('data-missing-idx'))]); };
    });
  }

  // พอเริ่มแสดงสีแดงแล้ว ทุกครั้งที่กรอก/กด จะอัปเดตทันที กรอกครบช่องไหนสีแดงหายช่องนั้น
  ['input', 'change', 'click'].forEach(function(ev){

  // คืนข้อความเตือนถ้ากรอกไม่ครบ (ว่าง = ครบ)
  function validateForm(){
    var list = getMissing();
    if(!list.length){ showMissing = false; applyMissingMarks(); return ''; }
    showMissing = true;
    // เปิดทุกหมวดที่มีข้อขาด ให้เห็นช่องแดงได้ทันที
    list.forEach(function(m){

      STRUCTURE.forEach(function(c){ if(c.items.indexOf(m.id) > -1) state.openCats[c.cat] = true; });

    renderCategories();
    applyMissingMarks();
    goToMissing(list[0]);
    return 'ยังกรอกไม่ครบ ' + list.length + ' จุด (ดูช่องสีแดง)';
  }

  });

  function enterEditMode(sub, pin){
    // พักร่างเดิมไว้ คืนให้เมื่อออกจากโหมดแก้ไข
    var backup = editCtx ? editCtx.backup : JSON.parse(JSON.stringify({
      site: state.site, date: state.date, recordedBy: state.recordedBy,
      signers: state.signers, items: state.items
    }));
    editCtx = { id: sub.id, submittedAt: sub.submittedAt, site: sub.site, lang: sub.lang, pin: pin, backup: backup };
    state.site = sub.site || '';
    state.date = sub.date || '';
    state.recordedBy = sub.recordedBy || '';
    state.signers = [(sub.signers && sub.signers[0]) || '', '', ''];
    ALL_ITEM_IDS.forEach(function(id){
      var it = (sub.items && sub.items[id]) || {};
      state.items[id] = {
        status: it.status || null, worker: it.worker || '', remark: it.remark || '', location: it.location || '',
        photos: (it.photos || []).map(function(u){ return { url: u, data: driveImgSrc(u), mimeType: '', name: '' }; })
      };
    });
    state.tab = 'form';
    renderAll();
    window.scrollTo(0, 0);
    showToast('เข้าสู่โหมดแก้ไขแล้ว');
  }

  function exitEditMode(){
    if(!editCtx) return;
    var b = editCtx.backup;
    editCtx = null;
    state.site = b.site; state.date = b.date; state.recordedBy = b.recordedBy;
    state.signers = b.signers; state.items = b.items;
    renderAll();
    saveDraft();
  }

  function renderEditBanner(){
    var el = document.getElementById('editBanner');
    if(!el) return;
    if(!editCtx){ el.innerHTML = ''; return; }
    el.innerHTML = '<div class="warn-banner" style="margin-top:16px">✏️ <span>กำลังแก้ไขรายการ: ' +
      escHtml(editCtx.site) + '</span>' +
      '<button type="button" class="ghost-btn" id="cancelEditBtn" style="margin-left:auto">ยกเลิกการแก้ไข</button></div>';
    document.getElementById('cancelEditBtn').onclick = function(){
      if(window.confirm('ยกเลิกการแก้ไข? ข้อมูลที่แก้ไว้จะไม่ถูกบันทึก')) exitEditMode();
    };
  }

  function populateSiteOptions(){
    if(els.siteInput.dataset.populated) return;
    var html = '<option value="">-- เลือกโครงการ --</option>';
    PROJECTS.forEach(function(p){
      html += '<option value="' + escAttr(projectLabel(p)) + '">' + escHtml(projectLabel(p)) + '</option>';
    });
    els.siteInput.innerHTML = html;
    els.siteInput.dataset.populated = '1';
  }

  function renderAll(){
    renderStaticText();
    renderTabUI();
    populateSiteOptions();
    els.siteInput.value = state.site;
    els.dateInput.value = state.date;
    els.recordedByInput.value = state.recordedBy;
    renderProgress();
    renderCategories();
    renderSignatures();
    renderPrintSheet();
    renderDashboard();
    updateSubmitBtn();
  }

  /* ---------------- Events ---------------- */
  els.langBtns.forEach(function(btn){
    btn.addEventListener('click', function(){ state.lang = btn.getAttribute('data-lang'); saveDraft(); renderAll(); });
  });

  els.tabBtns.forEach(function(btn){
    btn.addEventListener('click', function(){
      state.tab = btn.getAttribute('data-tab');
      renderTabUI();
      if(state.tab === 'dashboard') refreshSubmissions();
    });
  });
  document.getElementById('backToFormBtn').addEventListener('click', function(){
    state.tab = 'form'; renderTabUI();
  });

  document.getElementById('exportCsvBtn').addEventListener('click', exportDashboardCSV);

  els.dashSiteFilter.addEventListener('change', function(){
    state.dashSiteFilter = els.dashSiteFilter.value;
    renderDashboard();
  });

  els.dashDateFilter.addEventListener('change', function(){
    state.dashDateFilter = els.dashDateFilter.value;
    var isCustom = state.dashDateFilter === 'custom';
    els.dashDateFrom.classList.toggle('hidden', !isCustom);
    els.dashDateTo.classList.toggle('hidden', !isCustom);
    renderDashboard();
  });

  els.dashDateFrom.addEventListener('change', function(){
    state.dashDateFrom = els.dashDateFrom.value;
    renderDashboard();
  });

  els.dashDateTo.addEventListener('change', function(){
    state.dashDateTo = els.dashDateTo.value;
    renderDashboard();
  });

  els.siteInput.addEventListener('change', function(){ state.site = els.siteInput.value; saveDraft(); renderPrintSheet(); });
  els.dateInput.addEventListener('input', function(){ state.date = els.dateInput.value; saveDraft(); renderPrintSheet(); });
  els.recordedByInput.addEventListener('input', function(){ state.recordedBy = els.recordedByInput.value; saveDraft(); });

  els.categories.addEventListener('click', function(e){
    var toggleBtn = e.target.closest('[data-toggle]');
    if(toggleBtn){
      var cat = toggleBtn.getAttribute('data-toggle');
      state.openCats[cat] = !state.openCats[cat];
      var catEl = els.categories.querySelector('.category[data-cat="' + cat + '"]');
      catEl.classList.toggle('open', state.openCats[cat]);
      toggleBtn.setAttribute('aria-expanded', state.openCats[cat]);
      return;
    }
    var statusBtn = e.target.closest('.status-btn');
    if(statusBtn){
      var id = statusBtn.getAttribute('data-item');
      var status = statusBtn.getAttribute('data-status');
      var newStatus = (state.items[id].status === status) ? null : status;
      state.items[id].status = newStatus;
      if(newStatus !== 'area' && newStatus !== 'room'){
        state.items[id].location = '';
      }
      saveDraft();
      syncStatusButtonActiveClasses();
      var scrollY = window.scrollY;
      renderCategories();
      renderProgress();
      renderPrintSheet();
      window.scrollTo(0, scrollY);
    }
    var removeBtn = e.target.closest('[data-remove-photo]');
    if(removeBtn){
      var rid = removeBtn.getAttribute('data-remove-photo');
      var pIdx = parseInt(removeBtn.getAttribute('data-photo-index'), 10);
      state.items[rid].photos.splice(pIdx, 1);
      saveDraft();
      var scrollY2 = window.scrollY;
      renderCategories();
      renderPrintSheet();
      window.scrollTo(0, scrollY2);
    }
  });

  els.categories.addEventListener('input', function(e){
    var field = e.target.getAttribute('data-field');
    if(!field) return;
    var id = e.target.getAttribute('data-item');
    state.items[id][field] = e.target.value;
    saveDraft();
    renderPrintSheet();
  });

  els.categories.addEventListener('change', function(e){
    var photoItemId = e.target.getAttribute('data-photo-input');
    if(!photoItemId) return;
    var files = Array.prototype.slice.call(e.target.files || []);
    if(!files.length) return;
    Promise.all(files.map(readAndCompressImage)).then(function(results){
      results.forEach(function(r){ state.items[photoItemId].photos.push(r); });
      saveDraft();
      var scrollY3 = window.scrollY;
      renderCategories();
      renderPrintSheet();
      window.scrollTo(0, scrollY3);
    }).catch(function(err){
      console.error('อ่าน/ย่อรูปไม่สำเร็จ:', err);
      showToast(t('submitError'));
    });
    e.target.value = '';
  });

  els.signGrid.addEventListener('input', function(e){
    var idx = e.target.getAttribute('data-signer');
    if(idx === null) return;
    state.signers[idx] = e.target.value;
    saveDraft();
    renderPrintSheet();
  });

  els.expandAllBtn.addEventListener('click', function(){ STRUCTURE.forEach(function(c){ state.openCats[c.cat] = true; }); renderCategories(); });
  els.collapseAllBtn.addEventListener('click', function(){ STRUCTURE.forEach(function(c){ state.openCats[c.cat] = false; }); renderCategories(); });

  document.getElementById('printBtn').addEventListener('click', function(){ printOverride = null; renderPrintSheet(); window.print(); });
  els.submitBtn.addEventListener('click', doSubmit);

  document.getElementById('resetBtn').addEventListener('click', function(){
    if(!window.confirm(t('resetConfirm'))) return;
    state.site = ''; state.date = ''; state.recordedBy = ''; state.signers = ['', '', ''];
    ALL_ITEM_IDS.forEach(function(id){ state.items[id] = { status:null, worker:'', remark:'', location:'', photos:[] }; });
    saveDraft();
    renderAll();
  });

  // ถ้ากด "ดู/พิมพ์" จากแดชบอร์ด ให้พิมพ์ข้อมูลรายการนั้น ไม่ใช่ข้อมูลในฟอร์ม
  window.addEventListener('beforeprint', function(){ if(!printOverride) renderPrintSheet(); });
  window.addEventListener('afterprint', function(){ printOverride = null; });

  /* ---------------- Init ---------------- */
  loadDraft();
  renderAll();
  initDb();
})();
</script>
</body>
</html>
